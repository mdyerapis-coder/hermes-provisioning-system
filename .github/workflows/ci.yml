name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format, vet, and test
        run: make check

      - name: Race detector
        run: make test-race

      - name: Build CLI
        run: make build

      - name: Smoke test CLI
        run: |
          ./bin/hps version
          repo="$(mktemp -d)"
          mkdir -p "$repo"/{bootstrap,fedora,kickstarts,recovery,scripts}
          ./bin/hps validate --repo "$repo"
