name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Format, vet, and test
        run: make check

      - name: Race detector
        run: make test-race

      - name: Build CLI
        run: make build

      - name: Smoke test CLI
        run: |
          ./bin/hps version

          repo="$(mktemp -d)"
          mkdir -p "$repo"/{bootstrap,fedora,kickstarts,recovery,scripts}
          ./bin/hps validate --repo "$repo"

          ./bin/hps manifest validate \
            --file examples/manifests/fedora44-kde.json

          printf 'hermes\n' > "$repo/asset.bin"
          ./bin/hps asset verify \
            --file "$repo/asset.bin" \
            --sha256 d53ba9ce30ffd743f4f905a61ddcf2c4fe0e5c72a2cc57638657fdd4171d1f6f
